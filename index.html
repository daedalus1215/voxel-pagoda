<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Voxel Pagoda — three.js</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b7cfe4}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:14px;bottom:12px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#27394a;background:rgba(255,255,255,.5);padding:7px 11px;border-radius:8px;backdrop-filter:blur(4px);user-select:none;pointer-events:none}
</style>
</head>
<body>
<div id="hud">voxel pagoda · three.js<br>drag — orbit · wheel — zoom</div>
<script type="module">
import * as THREE from './lib/three.module.js';

/* ---------------- parameters ---------------- */
const q=new URLSearchParams(location.search);
const SEED=q.has('seed')?parseInt(q.get('seed'),10):null;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=SEED!=null?mulberry32(SEED):null;

/* ---------------- palette ---------------- */
const P = {
  roof:0x33343e, roofLight:0x4b4d5c, fascia:0x22232b, gold:0xe3b54e,
  wall:0xf3ecda, pillar:0x9e3b29, wood:0x7c4c2c, beam:0x5c3a21,
  door:0x46301b, win:0x3c2a17,
  stone:0x9c9da6, stoneDark:0x7b7c86,
  grass:0x6f9e57, grassDark:0x5c8a46, path:0xbdb7a9,
  trunk:0x6b4a30, leaf:0x4f8a3d, leafDark:0x3e722f, sakura:0xe8a7b8, sakuraDark:0xd4829a,
  light:0xffd27a,
};

/* subtle per-seed palette drift */
if(rng){
  const drift=hex=>new THREE.Color(hex).offsetHSL((rng()-.5)*.04,(rng()-.5)*.05,(rng()-.5)*.07).getHex();
  for(const k of Object.keys(P))P[k]=drift(P[k]);
}

/* tier plan: curated default, or generated from seed */
const TIERS_DEFAULT=[
  {b:9,h:5,eave:13,ridge:8,H:6,lift:4,ext:3,door:true},
  {b:7,h:4,eave:11,ridge:6,H:5,lift:4,ext:2,door:false},
  {b:5,h:4,eave:9, ridge:6,H:5,lift:4,ext:2,door:false},
  {b:4,h:3,eave:8, ridge:5,H:5,lift:4,ext:2,door:false},
  {b:3,h:3,eave:7, ridge:3,H:4,lift:4,ext:2,door:false},
];
function makeTiers(){
  const n=3+Math.floor(rng()*3);            /* 3..5 tiers */
  let b=9+Math.floor(rng()*3);              /* 9..11 */
  const tiers=[];
  for(let i=0;i<n;i++){
    let last=i===n-1, bNext=null;
    if(!last){
      bNext=Math.max(2,b-2-Math.floor(rng()*2));
      if(bNext>=b){bNext=null;last=true;}  /* can't shrink: end the stack */
    }
    const eave=b+3+Math.floor(rng()*2);     /* +3..+4 */
    const ridge=Math.min(last?Math.max(2,b-1):bNext+1+Math.floor(rng()*2),eave-2);
    tiers.push({b,h:i===0?5:(last&&b<5?3:4),eave,ridge,
      H:last?4:5+Math.floor(rng()*2),lift:3+Math.floor(rng()*2),
      ext:2+Math.floor(rng()*2),door:i===0});
    b=bNext??0;
    if(last)break;
  }
  return tiers;
}
const TIERS=rng?makeTiers():TIERS_DEFAULT;
const baseHalf=TIERS[0].b+1;

/* deterministic noise */
function hash(x,y,z){
  let h=(x*374761393+y*668265263+z*1274126177)|0;
  h=Math.imul(h^(h>>>13),1103515245);
  return ((h^(h>>>16))>>>0)/4294967296;
}

/* ---------------- voxel collector ---------------- */
const vox=[];
function put(x,y,z,c,j=0){
  if(j){ const f=1+(hash(x,y,z)-.5)*j; c=new THREE.Color(c).multiplyScalar(f).getHex(); }
  vox.push({x,y,z,c});
}
function fill(x0,x1,z0,z1,y0,y1,c,j=0){
  for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)put(x,y,z,c,j);
}
/* 1 at the four diagonal corners of a square footprint, 0 at edge midpoints */
function corner(x,z){
  const d=Math.hypot(x,z); if(d<.8) return 0;
  return Math.pow(Math.abs(Math.sin(2*Math.atan2(z,x))),1.6);
}

/* concave roof with upturned corners: solid mass, flat underside,
   profile half(l) = ridge + (eave-ridge)*u^1.55 + ext*u*cf, u=1 at eave */
function roof(baseY,eave,ridge,H,lift,ext){
  const m=eave+ext+1;
  const cR=new THREE.Color(P.roof), cL=new THREE.Color(P.roofLight);
  for(let x=-m;x<=m;x++)for(let z=-m;z<=m;z++){
    const s=Math.max(Math.abs(x),Math.abs(z));
    const cf=corner(x,z);
    let lmax=-1;
    for(let l=H-1;l>=0;l--){
      const u=(H-1-l)/(H-1);
      if(s<=ridge+(eave-ridge)*Math.pow(u,1.75)+ext*u*cf){lmax=l;break;}
    }
    if(lmax<0)continue;
    const u=(H-1-lmax)/(H-1);
    const top=baseY+lmax+Math.round(lift*cf*Math.pow(u,0.75));
    for(let y=baseY;y<=top;y++){
      let c;
      if(y===baseY)c=P.fascia;
      else if(y===top&&cf>.9&&u>.8)c=P.gold;
      else c=cR.clone().lerp(cL,(y-baseY)/Math.max(1,top-baseY)).getHex();
      put(x,y,z,c);
    }
  }
}

/* building floor: stone slab, walls, red corner pillars, door, windows, railing */
function building(slabY,slabHalf,b,h,door){
  fill(-slabHalf,slabHalf,-slabHalf,slabHalf,slabY,slabY,P.stone,.12);
  const off=Math.max(2,b-3);
  for(let y=slabY+1;y<=slabY+h;y++){
    for(let x=-b;x<=b;x++)for(let z=-b;z<=b;z++){
      if(Math.max(Math.abs(x),Math.abs(z))!==b)continue;
      if(Math.abs(x)===b&&Math.abs(z)===b){put(x,y,z,P.pillar);continue;}
      let c=P.wall;
      const top=y===slabY+h;
      if(top)c=P.beam;
      else if(door&&z===b&&Math.abs(x)<=1&&y<=slabY+2)c=P.door;
      else{
        const win=(z===b||z===-b)?(Math.abs(z)===b&&Math.abs(x)===off)
              :(x===b||x===-b)?(Math.abs(x)===b&&Math.abs(z)===off):false;
        if(win&&y>=slabY+h-3&&y<=slabY+h-2)c=P.win;
      }
      put(x,y,z,c,.06);
    }
  }
  for(let x=-slabHalf;x<=slabHalf;x++)for(let z=-slabHalf;z<=slabHalf;z++){
    if(Math.max(Math.abs(x),Math.abs(z))!==slabHalf)continue;
    if(z===slabHalf&&Math.abs(x)<=2)continue; /* gate opening in front */
    put(x,slabY+1,z,P.wood);
  }
}

/* ---------------- scene assembly ---------------- */
const G=35;
for(let x=-G;x<=G;x++)for(let z=-G;z<=G;z++){
  put(x,-1,z,hash(x,0,z)<.14?P.grassDark:P.grass,.10);
}
fill(-1,1,baseHalf+2,34,-1,-1,P.path,.10);   /* stone path */
fill(-2,2,baseHalf+1,baseHalf+1,0,0,P.path,.10);     /* entry step */

/* base platform */
fill(-baseHalf,baseHalf,-baseHalf,baseHalf,0,1,P.stone,.10);
for(let x=-baseHalf;x<=baseHalf;x++)for(let z=-baseHalf;z<=baseHalf;z++){
  if(Math.max(Math.abs(x),Math.abs(z))!==baseHalf)continue;
  if(z===baseHalf&&Math.abs(x)<=2)continue;
  put(x,2,z,P.wood);
}

/* stack the tiers */
let slabY=2;
for(const t of TIERS){
  building(slabY,t.b+1,t.b,t.h,t.door);
  const baseY=slabY+1+t.h;
  roof(baseY,t.eave,t.ridge,t.H,t.lift,t.ext);
  slabY=baseY+t.H;
}

/* golden finial (sorin) */
fill(0,0,0,0,slabY,slabY+8,P.gold);
fill(-1,1,-1,1,slabY+2,slabY+2,P.gold);
fill(-1,1,-1,1,slabY+4,slabY+4,P.gold);
fill(-1,1,-1,1,slabY+6,slabY+6,P.gold);
for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=-1;dy<=1;dy++){
  if(dx*dx+dz*dz+dy*dy<=2)put(dx,slabY+10+dy,dz,P.gold);
}
put(0,slabY+12,0,P.gold);

/* stone lanterns along the path */
const LANTERN_SPOTS=[[4,16],[-4,16],[4,26],[-4,26]];
const LANTERNS=LANTERN_SPOTS.slice(0,rng?2+2*Math.floor(rng()*2):LANTERN_SPOTS.length);
for(const [lx,lz] of LANTERNS){
  put(lx,-1,lz,P.stone);
  fill(lx,lx,lz,lz,0,2,P.stoneDark,.15);
  put(lx,3,lz,P.light);
  put(lx,4,lz,P.stoneDark);
}

/* trees */
const TREE_SPOTS=[[-20,-14],[22,-9],[-17,21],[14,18]];
for(const [tx,tz] of TREE_SPOTS.slice(0,rng?2+Math.floor(rng()*3):3)){
  const sak=hash(tx,tz,7)>.5;
  fill(tx,tx,tz,tz,-1,4,P.trunk,.12);
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++)for(let dy=-2;dy<=3;dy++){
    const r2=dx*dx+dz*dz+dy*dy*1.44;
    if(r2<=10+hash(tx+dx,tz+dy,0)*4)put(tx+dx,7+dy,tz+dz,hash(tx+dx,0,tz+dz)>.3?(sak?P.sakuraDark:P.leafDark):(sak?P.sakura:P.leaf),.08);
  }
}

/* rocks */
const ROCK_SPOTS=[[14,13,4],[-16,11,3],[15,-12,4],[-13,-15,2]];
for(const [rx,rz,n] of ROCK_SPOTS.slice(0,rng?2+Math.floor(rng()*3):4)){
  for(let i=0;i<n;i++){
    const ox=Math.round((hash(i,rx,rz)-.5)*3), oz=Math.round((hash(rx,i,rz)-.5)*3);
    const hgt=1+Math.round(hash(rx,oz,i));
    fill(rx+ox,rx+ox,rz+oz,rz+oz,-1,-1+hgt-1,P.stoneDark,.18);
  }
}

/* ---------------- three.js setup ---------------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbcd4e8);
scene.fog=new THREE.Fog(0xbcd4e8,90,240);

const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);

/* ---------------- hand-rolled bloom (no addons) ---------------- */
/* scene → MSAA RT; lantern flames (HDR, unlit) in a tiny separate scene →
   1/4-res HalfFloat RT; 2x separable 9-tap Gaussian; additive composite. */
const fsScene=new THREE.Scene();
const fsCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fsGeo=new THREE.BufferGeometry();
fsGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,3,-1,0,-1,3,0]),3));
const fsQuad=new THREE.Mesh(fsGeo,null);
fsQuad.frustumCulled=false;
fsScene.add(fsQuad);
const fsVert=`varying vec2 vUv;void main(){vUv=position.xy*0.5+0.5;gl_Position=vec4(position.xy,0.,1.);}`;
function quadMat(frag,unif){
  return new THREE.ShaderMaterial({uniforms:unif,vertexShader:fsVert,fragmentShader:frag,depthTest:false,depthWrite:false,toneMapped:false});
}
const blurMat=quadMat(`
uniform sampler2D tDiffuse;uniform vec2 uDir;uniform vec2 uTexel;
varying vec2 vUv;
void main(){
  vec2 o1=uDir*uTexel*1.384,o2=uDir*uTexel*3.231;
  vec4 c=texture2D(tDiffuse,vUv)*0.227027;
  c+=(texture2D(tDiffuse,vUv+o1)+texture2D(tDiffuse,vUv-o1))*0.316216;
  c+=(texture2D(tDiffuse,vUv+o2)+texture2D(tDiffuse,vUv-o2))*0.070270;
  gl_FragColor=c;
}`,
{tDiffuse:{value:null},uDir:{value:new THREE.Vector2()},uTexel:{value:new THREE.Vector2()}});
const compMat=quadMat(`
uniform sampler2D tScene;uniform sampler2D tBloom;uniform float uStrength;
varying vec2 vUv;
void main(){
  gl_FragColor=vec4(texture2D(tScene,vUv).rgb+texture2D(tBloom,vUv).rgb*uStrength,1.);
}`,
{tScene:{value:null},tBloom:{value:null},uStrength:{value:1.2}});
let sceneRT,bloomA,bloomB;
function makeRTs(){
  const pr=Math.min(devicePixelRatio,2);
  const w=Math.max(1,Math.floor(innerWidth*pr)),h=Math.max(1,Math.floor(innerHeight*pr));
  sceneRT?.dispose();bloomA?.dispose();bloomB?.dispose();
  sceneRT=new THREE.WebGLRenderTarget(w,h,{samples:4,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  const bw=w>>2||1,bh=h>>2||1;
  bloomA=new THREE.WebGLRenderTarget(bw,bh,{type:THREE.HalfFloatType,depthBuffer:false,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  bloomB=new THREE.WebGLRenderTarget(bw,bh,{type:THREE.HalfFloatType,depthBuffer:false,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  blurMat.uniforms.uTexel.value.set(1/bw,1/bh);
}
makeRTs();
const flameMat=new THREE.MeshBasicMaterial({color:new THREE.Color(0,0,0),toneMapped:false});
const flames=new THREE.InstancedMesh(new THREE.BoxGeometry(.7,.7,.7),flameMat,LANTERNS.length);
{
  const fm=new THREE.Matrix4();
  LANTERNS.forEach(([lx,lz],i)=>{fm.setPosition(lx,3,lz);flames.setMatrixAt(i,fm);});
  flames.instanceMatrix.needsUpdate=true;
}
const bloomScene=new THREE.Scene();
bloomScene.background=new THREE.Color(0);
bloomScene.add(flames);

const sun=new THREE.DirectionalLight(0xfff1dc,1.5);
sun.position.set(34,52,26);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:5,far:160});
sun.shadow.bias=-0.0004;
scene.add(sun);
const hemi=new THREE.HemisphereLight(0xcfe2f3,0x8fa070,0.7);
scene.add(hemi);

/* one instanced mesh for every voxel */
const N=vox.length;
const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.97,.97,.97),new THREE.MeshLambertMaterial(),N);
window.__vox=N;
const M=new THREE.Matrix4(), col=new THREE.Color();
vox.forEach((v,i)=>{M.setPosition(v.x,v.y,v.z);mesh.setMatrixAt(i,M);mesh.setColorAt(i,col.set(v.c));});
mesh.instanceMatrix.needsUpdate=true;
if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
mesh.castShadow=true;
mesh.receiveShadow=true;
mesh.frustumCulled=false;
scene.add(mesh);

/* ---------------- ambient motion: clouds, petals, intro tour ---------------- */
const ambRng=mulberry32(((SEED??0x5eed)>>>0));

/* drifting voxel clouds */
const cloudData=[];
{
  const cluster=(w,d)=>{
    const v=[];
    for(let x=-w;x<=w;x++)for(let z=-d;z<=d;z++){
      const e=(x*x)/(w*w)+(z*z)/(d*d);
      if(e<=1.05-0.25*Math.abs(x)/w)v.push({x,z,y:0});
      if(e<=0.45)v.push({x,z,y:1});
    }
    return v;
  };
  for(let c=0;c<7;c++){
    cloudData.push({
      x:(ambRng()*2-1)*(G+10), z:(ambRng()*2-1)*(G+10),
      y:44+Math.floor(ambRng()*12), sp:0.6+ambRng()*1.2,
      vox:cluster(4+Math.floor(ambRng()*5),2+Math.floor(ambRng()*3)),
    });
  }
}
let cloudN=0; for(const c of cloudData)cloudN+=c.vox.length;
const cloudMat=new THREE.MeshLambertMaterial({color:0xf4f7fb});
const cloudMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.8,1),cloudMat,cloudN);
cloudMesh.frustumCulled=false;
scene.add(cloudMesh);

/* falling petals: one Points object, deterministic per seed */
function makePetalTexture(){
  const c=document.createElement('canvas');c.width=c.height=32;
  const g=c.getContext('2d');
  g.translate(16,16);g.rotate(.6);
  const gr=g.createRadialGradient(0,0,2,0,0,14);
  gr.addColorStop(0,'rgba(255,216,226,1)');
  gr.addColorStop(1,'rgba(243,164,190,0)');
  g.fillStyle=gr;
  g.beginPath();g.ellipse(0,0,13,8,0,0,6.283);g.fill();
  return new THREE.CanvasTexture(c);
}
const PALS=240;
const pPos=new Float32Array(PALS*3),pVy=new Float32Array(PALS),pFr=new Float32Array(PALS),pPh=new Float32Array(PALS),pTop=new Float32Array(PALS);
for(let i=0;i<PALS;i++){
  pPos[i*3]=(ambRng()*2-1)*(G+4);
  pPos[i*3+1]=2+ambRng()*45;
  pPos[i*3+2]=(ambRng()*2-1)*(G+4);
  pVy[i]=.8+ambRng()*1.4; pFr[i]=.4+ambRng(); pPh[i]=ambRng()*6.283;
  pTop[i]=42+ambRng()*14;
}
const petalGeo=new THREE.BufferGeometry();
petalGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const petalMat=new THREE.PointsMaterial({map:makePetalTexture(),size:.8,transparent:true,opacity:.9,depthWrite:false});
const petals=new THREE.Points(petalGeo,petalMat);
petals.frustumCulled=false;
scene.add(petals);

const cM=new THREE.Matrix4();
function updateClouds(dt){
  let i=0;
  for(const c of cloudData){
    c.x+=c.sp*dt;
    if(c.x>G+16)c.x=-G-16;
    for(const v of c.vox){
      cM.setPosition(c.x+v.x,c.y+v.y,c.z+v.z);
      cloudMesh.setMatrixAt(i++,cM);
    }
  }
  cloudMesh.instanceMatrix.needsUpdate=true;
}
function updatePetals(t,dt){
  for(let i=0;i<PALS;i++){
    const j=i*3;
    pPos[j+1]-=pVy[i]*dt;
    pPos[j]+=Math.sin(t*pFr[i]+pPh[i])*dt*.8+dt*.2;
    pPos[j+2]+=Math.cos(t*pFr[i]*.7+pPh[i])*dt*.5;
    if(pPos[j+1]<-.8)pPos[j+1]=pTop[i];
  }
  petalGeo.attributes.position.needsUpdate=true;
}

/* cinematic intro: slow rise-and-orbit until first user input */
let tour=true,tourT=0;

/* night mode: ?night=1 or press n */
const lanternLights=[];
for(const [lx,lz] of LANTERNS){
  const L=new THREE.PointLight(0xffb347,0,14,2);
  L.position.set(lx,3.5,lz);
  scene.add(L);
  lanternLights.push(L);
}
let night=q.get('night')==='1'||q.get('night')==='true';
function setNight(on){
  night=on;
  scene.background.set(on?0x0d1322:0xbcd4e8);
  scene.fog.color.copy(scene.background);
  sun.color.set(on?0x93a7cc:0xfff1dc);
  sun.intensity=on?0.9:1.5;
  hemi.color.set(on?0x1c2740:0xcfe2f3);
  hemi.groundColor.set(on?0x0e131c:0x8fa070);
  hemi.intensity=on?0.55:0.7;
  for(const L of lanternLights)L.intensity=on?15:0;
  cloudMat.color.set(on?0x2a3550:0xf4f7fb);
  petalMat.opacity=on?.35:.9;
  petalMat.color.set(on?0x8a5566:0xffffff);
  flameMat.color.setRGB(on?2.6:0,on?1.9:0,on?1.0:0);
}
addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N')setNight(!night);});
setNight(night);

/* HUD */
document.getElementById('hud').innerHTML=
  `voxel pagoda · three.js${SEED!=null?` · seed ${SEED}`:''}<br>drag — orbit · wheel — zoom · n — night<br>cinematic intro stops on first input`;

/* ---------------- orbit control ---------------- */
const target=new THREE.Vector3(0,22,0);
let theta=0.9,phi=1.25,r=108, tTheta=theta,tPhi=phi,tR=r;
let dragging=false,lx=0,ly=0,idle=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{dragging=true;tour=false;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup',()=>dragging=false);
el.addEventListener('pointermove',e=>{
  if(!dragging)return;
  tTheta-=(e.clientX-lx)*0.005;
  tPhi=Math.max(0.08,Math.min(1.52,tPhi-(e.clientY-ly)*0.005));
  lx=e.clientX;ly=e.clientY;idle=0;
});
el.addEventListener('wheel',e=>{
  e.preventDefault();
  tour=false;
  tR=Math.max(18,Math.min(140,tR*Math.exp(e.deltaY*0.0012)));
  idle=0;
},{passive:false});

let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(tour){
    tourT+=dt;
    const k=Math.min(1,tourT/28),e=k*k*(3-2*k);
    theta=tTheta=-.6+e*1.9;
    phi=tPhi=1.38-.23*e;
    r=tR=150-55*e;
    target.y=34-18*e;
  }else{
    if(!dragging){idle+=16;if(idle>2500)tTheta+=0.0016;}
    theta+=(tTheta-theta)*.12;
    phi+=(tPhi-phi)*.12;
    r+=(tR-r)*.12;
  }
  cam.position.set(
    target.x+r*Math.sin(phi)*Math.sin(theta),
    target.y+r*Math.cos(phi),
    target.z+r*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target);
  updateClouds(dt);
  updatePetals(now/1000,dt);
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene,cam);
  renderer.setRenderTarget(bloomA);
  renderer.render(bloomScene,cam);
  fsQuad.material=blurMat;
  blurMat.uniforms.tDiffuse.value=bloomA.texture;
  blurMat.uniforms.uDir.value.set(1,0);
  renderer.setRenderTarget(bloomB);
  renderer.render(fsScene,fsCam);
  blurMat.uniforms.tDiffuse.value=bloomB.texture;
  blurMat.uniforms.uDir.value.set(0,1);
  renderer.setRenderTarget(bloomA);
  renderer.render(fsScene,fsCam);
  blurMat.uniforms.tDiffuse.value=bloomA.texture;
  blurMat.uniforms.uDir.value.set(1,0);
  renderer.setRenderTarget(bloomB);
  renderer.render(fsScene,fsCam);
  blurMat.uniforms.tDiffuse.value=bloomB.texture;
  blurMat.uniforms.uDir.value.set(0,1);
  renderer.setRenderTarget(bloomA);
  renderer.render(fsScene,fsCam);
  fsQuad.material=compMat;
  compMat.uniforms.tScene.value=sceneRT.texture;
  compMat.uniforms.tBloom.value=bloomA.texture;
  renderer.setRenderTarget(null);
  renderer.render(fsScene,fsCam);
}
requestAnimationFrame(frame);

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  makeRTs();
});
</script>
</body>
</html>
